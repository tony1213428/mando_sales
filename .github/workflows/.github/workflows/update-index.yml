name: Update data index

on:
  push:
    paths:
      - 'data/**.xlsx'

jobs:
  update-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate data/index.json
        run: |
          python3 - <<'EOF'
          import os, json
          files = sorted([
              f for f in os.listdir('data')
              if f.endswith('.xlsx')
          ])
          with open('data/index.json', 'w', encoding='utf-8') as fp:
              json.dump(files, fp, ensure_ascii=False, indent=2)
          print("index.json updated:", files)
          EOF

      - name: Commit index.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/index.json
          git diff --cached --quiet || git commit -m "chore: update data/index.json"
          git push
